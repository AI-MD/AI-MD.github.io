<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>트레이더스 주류 재고 · 가격 · 리뷰</title>
<meta name="description" content="이마트 트레이더스 전국 24개 지점 주류(위스키·와인) 실시간 재고·가격·평점 조회" />
<style>
  :root{--amber:#B8791A;--amberD:#95610F;--ink:#2B2622;--sub:#8A8177;--line:#EAE4DB;--card:#FFF;--bg:#F6F3EE;--green:#1F9E5A;--sh:0 1px 2px rgba(43,38,34,.04),0 4px 16px rgba(43,38,34,.06);}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Pretendard','Apple SD Gothic Neo',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  img{max-width:100%}
  a{color:inherit}
  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#D8D0C4;border-radius:4px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .wrap{max-width:1320px;margin:0 auto}
  header{background:rgba(246,243,238,.9);backdrop-filter:saturate(1.6) blur(10px);border-bottom:1px solid var(--line);padding:0 20px;position:sticky;top:0;z-index:100}
  .hin{max-width:1320px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:62px;gap:12px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:10px}
  .logo .ic{font-size:24px}.logo .t{font-size:17px;font-weight:800;color:var(--amberD);letter-spacing:.06em}.logo .s{font-size:11px;color:var(--sub)}
  .upd{font-size:11.5px;color:var(--sub);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 11px}
  .srcbtn{font-size:12px;font-weight:700;color:var(--amberD);background:var(--card);border:1px solid #EBDCBE;border-radius:10px;padding:8px 12px;text-decoration:none;box-shadow:var(--sh)}
  .warn{background:#FCF3E6;border-bottom:1px solid #F2E3C9;color:#9A6A16;font-size:12.5px;padding:9px 20px;text-align:center;line-height:1.5}
  .catbar{background:var(--bg);border-bottom:1px solid var(--line);padding:0 20px;position:sticky;top:62px;z-index:90}
  .cattabs{display:flex;gap:7px;overflow-x:auto;padding:11px 0}
  .cattab{display:flex;align-items:center;gap:5px;font-size:13.5px;font-weight:500;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:7px 14px;white-space:nowrap;box-shadow:var(--sh)}
  .cattab.on{font-weight:700;color:#fff;background:var(--amber);border-color:var(--amber);box-shadow:0 2px 8px rgba(184,121,26,.25)}
  .cattab .c{font-size:11px;font-weight:700;background:#F0EBE2;color:var(--sub);border-radius:10px;padding:1px 7px}
  .cattab.on .c{background:rgba(255,255,255,.25);color:#fff}
  .filter{background:var(--bg);padding:14px 20px 6px}
  .frow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .search{flex:1;min-width:210px;position:relative;display:flex;align-items:center}
  .search span{position:absolute;left:13px;font-size:13px;opacity:.5}
  .search input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--ink);font-size:14px;padding:11px 34px;outline:none;box-shadow:var(--sh)}
  select{background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--ink);font-size:13px;padding:10px 12px;outline:none;box-shadow:var(--sh)}
  .toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--sub)}
  .track{width:38px;height:22px;border-radius:11px;background:#DDD5C8;position:relative;flex-shrink:0;transition:all .2s}
  .track.on{background:var(--amber)}.thumb{width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:all .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}.track.on .thumb{left:19px}
  main{padding:14px 20px 56px}
  .rc{font-size:13px;color:var(--sub);margin:6px 0 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  .card{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh);padding:0;color:inherit;width:100%}
  .cimg{position:relative;height:156px;background:#FBFAF7;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid var(--line)}
  .cimg img{width:100%;height:100%;object-fit:contain;padding:14px;mix-blend-mode:multiply}
  .cimg .fb{font-size:44px;opacity:.4}
  .catchip{position:absolute;top:9px;left:9px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:7px;background:rgba(255,255,255,.92);color:var(--amberD);box-shadow:var(--sh)}
  .stkchip{position:absolute;top:9px;right:9px;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:7px;color:#fff}
  .cbody{padding:12px 13px 14px}
  .cname{font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.4;margin-bottom:7px;min-height:38px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .rr{display:flex;align-items:center;gap:5px;margin-bottom:8px;flex-wrap:wrap}
  .stars{font-size:12px;color:#E8A81C;letter-spacing:-1px}
  .rn{font-size:12px;font-weight:700}.rc2{font-size:11px;color:var(--sub)}.nr{font-size:11px;color:#B9AE9E}
  .vivino{font-size:10.5px;font-weight:700;color:#8E1F3A;background:#FBE9EE;border-radius:6px;padding:1px 6px}
  .pr{display:flex;align-items:baseline;gap:6px;margin-bottom:8px}
  .price{font-size:18px;font-weight:800;letter-spacing:-.02em}.disc{font-size:11.5px;font-weight:700;color:#D8562F}
  .ds{font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:7px;margin-bottom:10px;display:inline-block}
  .cfoot{display:flex;align-items:center;justify-content:space-between;gap:6px;border-top:1px solid var(--line);padding-top:9px}
  .sc{font-size:11px;color:var(--sub)}.dl{font-size:11px;font-weight:700;color:var(--amber)}
  .overlay{position:fixed;inset:0;background:rgba(43,38,34,.42);backdrop-filter:blur(3px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:18px}
  .modal{background:var(--bg);border-radius:20px;width:100%;max-width:540px;max-height:88vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(43,38,34,.28)}
  .hero{display:flex;gap:14px;padding:20px 20px 16px;background:var(--card);border-bottom:1px solid var(--line);position:relative}
  .hero .im{width:84px;height:84px;border-radius:14px;background:#FBFAF7;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
  .hero .im img{width:100%;height:100%;object-fit:contain;padding:6px;mix-blend-mode:multiply}
  .hcat{font-size:10.5px;font-weight:700;color:var(--amberD);background:#F7EFDF;border-radius:6px;padding:2px 7px}
  .hname{font-size:16px;font-weight:800;margin:6px 0;line-height:1.35}
  .hprice{font-size:21px;font-weight:800}.hunit{font-size:11px;color:var(--sub)}
  .close{position:absolute;top:14px;right:14px;background:#F0EBE2;border:none;color:var(--sub);font-size:15px;border-radius:8px;width:28px;height:28px}
  .tasting{padding:14px 20px;background:var(--card);border-bottom:1px solid var(--line)}
  .sl{font-size:12.5px;font-weight:800;margin-bottom:9px;display:flex;align-items:center;gap:6px}
  .src{font-size:9.5px;font-weight:700;color:var(--sub);background:#F0EBE2;border-radius:5px;padding:1px 6px}
  .tchips{display:flex;gap:8px;flex-wrap:wrap}
  .tchip{font-size:11.5px;background:#FBF7EF;border:1px solid var(--line);border-radius:8px;padding:6px 10px;line-height:1.3}
  .tchip b{color:var(--amber)}
  .tabs{display:flex;gap:4px;padding:10px 16px 0;background:var(--card)}
  .tab{font-size:13px;font-weight:600;color:var(--sub);background:none;border:none;border-bottom:2.5px solid transparent;padding:9px 12px}
  .tab.on{font-weight:800;color:var(--amberD);border-bottom-color:var(--amber)}
  .mscroll{overflow-y:auto;background:var(--card);flex:1}
  .summ{font-size:12.5px;color:var(--sub);padding:12px 20px 8px}
  .region{font-size:11px;font-weight:800;color:var(--amberD);letter-spacing:.05em;padding:12px 20px 4px}
  .srow{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;border-top:1px solid var(--line)}
  .srow.has{background:#F5FBF7}
  .sn{font-size:13px;font-weight:600}.sa{font-size:10.5px;color:var(--sub);margin-top:2px}
  .sq{font-size:13.5px;font-weight:800}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:middle}
  .rev{padding:12px 20px;border-top:1px solid var(--line)}
  .rev .h{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .ptag{font-size:10px;font-weight:700;color:var(--amberD);background:#F7EFDF;border-radius:5px;padding:1px 6px}
  .rev .txt{font-size:12.5px;color:#4A433C;line-height:1.55;white-space:pre-wrap}
  .mwarn{font-size:11px;color:#9A6A16;background:#FCF3E6;padding:10px 20px;line-height:1.5;border-top:1px solid #F2E3C9}
  .empty{text-align:center;padding:60px 24px;color:var(--sub)}
  .loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:60px;color:var(--sub)}
  .sp{width:26px;height:26px;border:3px solid var(--line);border-top:3px solid var(--amber);border-radius:50%;animation:spin .8s linear infinite}
  .more{display:block;text-align:center;padding:14px;font-size:12.5px;font-weight:700;color:var(--amber);text-decoration:none}
</style>
</head>
<body>
<header><div class="hin">
  <div class="logo"><span class="ic">🍾</span><div><div class="t">TRADERS LIQUOR</div><div class="s">트레이더스 주류 재고 · 가격 · 리뷰</div></div></div>
  <div style="display:flex;align-items:center;gap:8px">
    <span class="upd" id="upd">불러오는 중…</span>
    <a class="srcbtn" id="srcbtn" href="#" target="_blank">GitHub</a>
  </div>
</div></header>
<div class="warn">⚠ 실시간 조회지만 <b>현장 실물과 다를 수 있습니다</b> — 시스템상 '재고있음'이어도 매장에 없을 수 있으니 <b>방문 전 100% 신뢰하지 마세요.</b> · 조회 전용</div>
<div class="catbar"><div class="wrap"><div class="cattabs" id="cattabs"></div></div></div>
<div class="filter"><div class="wrap"><div class="frow">
  <div class="search"><span>🔍</span><input id="q" placeholder="주류 검색 (예: 발렌타인, 발베니)…" /></div>
  <select id="store"><option value="">전지점 집계</option></select>
  <select id="sort"><option value="stock_desc">재고 많은순</option><option value="name">이름순</option><option value="price_asc">낮은 가격순</option><option value="price_desc">높은 가격순</option></select>
  <label class="toggle"><div class="track" id="track"><div class="thumb"></div></div><span>재고있는 것만</span></label>
</div></div></div>
<main><div class="wrap"><div class="rc" id="rc"></div><div class="grid" id="grid"><div class="loading"><div class="sp"></div> 데이터 불러오는 중…</div></div></div></main>
<div id="modalRoot"></div>

<script>
const CAT_ICON={전체:"🍾",위스키:"🥃",와인:"🍷",스파클링:"🥂",브랜디:"🍸","사케·전통주":"🍶",하이볼:"🥤",리큐르:"🍹",진:"🌿",럼:"🥃",데킬라:"🌵",보드카:"❄️",기타:"🍾"};
const CAT_ORDER=["위스키","와인","스파클링","브랜디","리큐르","진","럼","데킬라","보드카","사케·전통주","하이볼","기타"];
const REPO="https://github.com/AI-MD/traders-liquor-tracker";
let DATA=null, state={cat:"전체",q:"",store:"",sort:"stock_desc",inStock:false};

const won=n=>n>0?n.toLocaleString()+"원":"가격 정보 없음";
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const regionOf=a=>!a?"기타":(a.split(" ")[0].replace("특별자치도","").replace("특별시","").replace("광역시","").replace("도","").slice(0,2)||"기타");
const stars=r=>r?`<span class="stars">${"★".repeat(Math.round(r))}${"☆".repeat(5-Math.round(r))}</span>`:"";

function dsBadge(p){
  if(p.price_diff_percent==null)return "";
  const d=p.price_diff_percent, cheap=d<0, eq=Math.abs(d)<.5;
  const col=eq?"#8A8177":cheap?"#1F9E5A":"#D8562F", bg=eq?"#F0EEEA":cheap?"#E7F6EE":"#FCEBE5";
  const lab=eq?"데일리샷과 비슷":cheap?`데일리샷보다 ${Math.abs(d)}% 저렴`:`데일리샷보다 ${d}% 비쌈`;
  return `<div class="ds" style="color:${col};background:${bg}">${cheap?"▼":eq?"≈":"▲"} ${lab}${p.dailyshot_price?` · 최저 ${p.dailyshot_price.toLocaleString()}원`:""}</div>`;
}

function computeStore(p){ // store filter: recompute price/stock for selected store
  if(!state.store) return {price:p.price,inv:p.total_inventory,cnt:p.stores_in_stock_count,in:p.in_stock};
  const s=(p.stores||[]).find(x=>x.store_id===state.store);
  if(!s) return {price:0,inv:0,cnt:0,in:false,absent:true};
  const has=!s.out_of_stock&&(s.inventory||0)>0;
  return {price:s.price||p.price,inv:s.inventory||0,cnt:has?1:0,in:has};
}

function card(p){
  const cs=computeStore(p);
  const rr=p.rating?`${stars(p.rating)}<span class="rn">${p.rating}</span><span class="rc2">(${p.review_count})</span>`:`<span class="nr">평점 없음</span>`;
  const viv=p.vivino_score?`<span class="vivino">Vivino ${p.vivino_score}</span>`:"";
  return `<button class="card" data-sku="${p.sku}">
    <div class="cimg">${p.image?`<img src="${p.image}" loading="lazy" onerror="this.style.visibility='hidden'"/>`:`<span class="fb">${CAT_ICON[p.category]||"🍾"}</span>`}
      <span class="catchip">${CAT_ICON[p.category]||""} ${p.category}</span>
      <span class="stkchip" style="background:${cs.in?"#1F9E5A":"#B9AE9E"}">${cs.in?`재고 ${cs.inv.toLocaleString()}`:"품절"}</span></div>
    <div class="cbody"><div class="cname">${esc(p.name)}</div>
      <div class="rr">${rr}${viv}</div>
      <div class="pr"><span class="price">${won(cs.price)}</span>${p.discount_percent>0?`<span class="disc">${p.discount_percent}%↓</span>`:""}</div>
      ${dsBadge(p)}
      <div class="cfoot"><span class="sc">🏬 ${cs.cnt}개 지점 보유</span><span class="dl">상세 · 지점별 →</span></div></div></button>`;
}

function render(){
  const s=DATA.stats;
  // tabs
  const cats=["전체",...CAT_ORDER.filter(c=>s.by_category[c]),...Object.keys(s.by_category).filter(c=>!CAT_ORDER.includes(c))];
  document.getElementById("cattabs").innerHTML=cats.map(c=>`<button class="cattab ${state.cat===c?"on":""}" data-cat="${c}">${CAT_ICON[c]||"🍾"} ${c}<span class="c">${c==="전체"?s.total:(s.by_category[c]||0)}</span></button>`).join("");
  // filter
  let list=DATA.products.slice();
  if(state.q){const q=state.q.toLowerCase();list=list.filter(p=>p.name.toLowerCase().includes(q));}
  if(state.cat!=="전체")list=list.filter(p=>p.category===state.cat);
  if(state.store)list=list.filter(p=>(p.stores||[]).some(x=>x.store_id===state.store));
  if(state.inStock)list=list.filter(p=>computeStore(p).in);
  const key={stock_desc:p=>-computeStore(p).inv,price_asc:p=>computeStore(p).price||9e9,price_desc:p=>-(computeStore(p).price||0),name:p=>p.name};
  list.sort((a,b)=>{const f=key[state.sort];const x=f(a),y=f(b);return typeof x==="string"?x.localeCompare(y):x-y;});
  document.getElementById("rc").innerHTML=`총 <b>${list.length}</b>종 · 재고 보유 ${s.in_stock_skus}종 · 총 재고 ${(s.total_inventory||0).toLocaleString()}개`;
  document.getElementById("grid").innerHTML=list.length?list.map(card).join(""):`<div class="empty"><div style="font-size:44px">🍾</div><div style="margin-top:12px">결과가 없습니다</div></div>`;
}

function detail(p){
  const stores=(p.stores||[]).slice().sort((a,b)=>(a.out_of_stock-b.out_of_stock)||((b.inventory||0)-(a.inventory||0)));
  const inStock=stores.filter(s=>!s.out_of_stock&&(s.inventory||0)>0);
  const byReg={};stores.forEach(s=>{const r=regionOf(s.address);(byReg[r]=byReg[r]||[]).push(s);});
  const hasStock=g=>g.some(s=>!s.out_of_stock&&s.inventory>0);
  const regs=Object.entries(byReg).sort((a,b)=>hasStock(b[1])-hasStock(a[1]));
  const sumTxt=inStock.length?` · 합계 ${inStock.reduce((a,s)=>a+(s.inventory||0),0).toLocaleString()}개`:"";
  let storeHtml=`<div class="summ">총 <b>${stores.length}</b>개 지점 중 <b style="color:#1F9E5A">${inStock.length}</b>개 보유${sumTxt}</div>`;
  if(!inStock.length) storeHtml+=`<div class="empty">재고 보유 지점이 없습니다.</div>`;
  regs.forEach(function(pair){
    storeHtml+=`<div class="region">${esc(pair[0])}</div>`;
    pair[1].forEach(function(s){
      const has=!s.out_of_stock&&s.inventory>0;
      const dot=has?'<span class="dot"></span>':"";
      const addr=s.address?`<div class="sa">${esc(s.address)}</div>`:"";
      const qty=has?s.inventory.toLocaleString()+"개":"품절";
      storeHtml+=`<div class="srow ${has?"has":""}"><div><div class="sn">${dot}${esc(s.store_name)}</div>${addr}</div><div class="sq" style="color:${has?"#1F9E5A":"#C3B9AA"}">${qty}</div></div>`;
    });
  });
  let revHtml;
  if(p.reviews&&p.reviews.length){
    revHtml="";
    p.reviews.forEach(function(rv){
      const pt=rv.is_purchase?'<span class="ptag">구매</span>':"";
      const up=rv.upvotes>0?`<span class="rc2">👍 ${rv.upvotes}</span>`:"";
      revHtml+=`<div class="rev"><div class="h">${stars(rv.rate)}${pt}${up}</div><div class="txt">${esc(rv.text)}</div></div>`;
    });
    if(p.dailyshot_url) revHtml+=`<a class="more" href="${p.dailyshot_url}" target="_blank">데일리샷에서 더 보기 →</a>`;
  } else { revHtml=`<div class="empty">리뷰가 없습니다.</div>`; }
  const viv=p.vivino_score?`<span class="vivino">Vivino ${p.vivino_score}</span>`:"";
  const rr=p.rating?`${stars(p.rating)}<span class="rn">${p.rating}</span><span class="rc2">· 리뷰 ${p.review_count}</span>`:`<span class="nr">평점 없음</span>`;
  document.getElementById("modalRoot").innerHTML=`<div class="overlay" id="ov"><div class="modal" onclick="event.stopPropagation()">
    <div class="hero"><div class="im">${p.image?`<img src="${p.image}"/>`:`<span style="font-size:40px">${CAT_ICON[p.category]}</span>`}</div>
      <div style="flex:1;min-width:0"><span class="hcat">${CAT_ICON[p.category]} ${p.category}</span>
        <div class="hname">${esc(p.name)}</div><div class="rr">${rr}${viv}</div>
        <div style="display:flex;align-items:baseline;gap:8px;margin:8px 0"><span class="hprice">${won(p.price)}</span>${p.unit_price_text?`<span class="hunit">${esc(p.unit_price_text)}</span>`:""}</div>
        ${dsBadge(p)}</div><button class="close" onclick="closeModal()">✕</button></div>
    ${p.tasting_notes&&p.tasting_notes.length?`<div class="tasting"><div class="sl">🥃 테이스팅 노트 <span class="src">데일리샷</span></div><div class="tchips">${p.tasting_notes.map(n=>`<div class="tchip"><b>${esc(n.label)}</b> ${esc(n.value)}</div>`).join("")}</div></div>`:""}
    <div class="tabs"><button class="tab on" data-tab="stores">지점별 재고</button><button class="tab" data-tab="reviews">리뷰 ${p.review_count?`(${p.review_count})`:""}</button></div>
    <div class="mscroll" id="tabc">${storeHtml}</div>
    <div class="mwarn">⚠ 재고 수치는 시스템 기준이며 <b>현장 실물과 다를 수 있습니다.</b> 방문 전 100% 신뢰하지 마세요.</div></div></div>`;
  document.getElementById("ov").onclick=closeModal;
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));t.classList.add("on");document.getElementById("tabc").innerHTML=t.dataset.tab==="stores"?storeHtml:revHtml;});
}
function closeModal(){document.getElementById("modalRoot").innerHTML="";}

// events
document.getElementById("q").oninput=e=>{state.q=e.target.value;render();};
document.getElementById("store").onchange=e=>{state.store=e.target.value;render();};
document.getElementById("sort").onchange=e=>{state.sort=e.target.value;render();};
document.getElementById("track").parentElement.onclick=()=>{state.inStock=!state.inStock;document.getElementById("track").classList.toggle("on",state.inStock);render();};
document.getElementById("cattabs").onclick=e=>{const b=e.target.closest(".cattab");if(b){state.cat=b.dataset.cat;render();}};
document.getElementById("grid").onclick=e=>{const c=e.target.closest(".card");if(c){const p=DATA.products.find(x=>x.sku===c.dataset.sku);if(p)detail(p);}};
document.getElementById("srcbtn").href=REPO;

fetch("data.json").then(r=>r.json()).then(d=>{
  DATA=d;
  document.getElementById("upd").textContent="갱신 "+new Date(d.updated_at).toLocaleString("ko-KR",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
  const ss=document.getElementById("store");d.branches.forEach(b=>{const o=document.createElement("option");o.value=b.store_id;o.textContent=b.name;ss.appendChild(o);});
  render();
}).catch(e=>{document.getElementById("grid").innerHTML=`<div class="empty">데이터를 불러오지 못했습니다. (data.json)</div>`;});
</script>
</body>
</html>
