<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>주락 포춘 — 오늘의 술 운세</title>
<meta name="description" content="포춘쿠키를 깨면 오늘의 술 운세와 오늘 마실 한 병이 나옵니다. 하루 한 번, 재미로 보는 주락(酒樂)의 데일리 운세.">
<meta property="og:title" content="🥠 주락 포춘 — 오늘의 술 운세">
<meta property="og:description" content="쿠키를 깨고 오늘의 운세와 '오늘의 한 병'을 받아보세요. 하루 한 번, 자정 리셋.">
<meta property="og:url" content="https://jurak.kr/fortune/">
<meta property="og:image" content="https://jurak.kr/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥠</text></svg>">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--gold:#E5C57F;--goldD:#B8791A;--mut:#B4A17C;--ink:#26211A;--paper:#F7F2E8;--line:#5C4826}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo",sans-serif;
  background:linear-gradient(175deg,#1C140C 0%,#221910 40%,#2A2013 100%);color:var(--gold);
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
/* 은은한 골드 입자 */
.dust{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.dust i{position:absolute;display:block;width:3px;height:3px;border-radius:50%;background:rgba(229,197,127,.5);
  animation:float 9s linear infinite}
@keyframes float{0%{transform:translateY(105vh) scale(.6);opacity:0}12%{opacity:.7}88%{opacity:.5}100%{transform:translateY(-6vh) scale(1.1);opacity:0}}
header{text-align:center;padding:56px 22px 8px;position:relative;z-index:2}
.eyebrow{font-size:12px;letter-spacing:.22em;color:var(--mut);font-weight:600}
h1{font-size:31px;font-weight:800;letter-spacing:.06em;margin:12px 0 10px;color:#F1E0BC;text-shadow:0 2px 18px rgba(184,121,26,.35)}
.sub{font-size:13.5px;line-height:1.75;color:var(--mut)}
.divider{display:flex;align-items:center;gap:12px;justify-content:center;margin:22px auto 0;max-width:280px}
.divider .l{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line))}
.divider .l:last-child{background:linear-gradient(90deg,var(--line),transparent)}
.divider .d{font-size:11px;color:var(--goldD)}
/* 쟁반 */
.tray{position:relative;z-index:2;display:flex;flex-wrap:wrap;justify-content:center;gap:10px 6px;padding:34px 18px 10px;max-width:520px}
.cookie{background:none;border:none;cursor:pointer;font-size:58px;line-height:1;padding:12px 8px;border-radius:20px;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.45));transition:transform .18s ease;animation:bob 3.4s ease-in-out infinite}
.cookie:nth-child(2){animation-delay:.5s}.cookie:nth-child(3){animation-delay:1.1s}
.cookie:nth-child(4){animation-delay:1.7s}.cookie:nth-child(5){animation-delay:2.3s}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(4deg)}}
.cookie:hover{transform:translateY(-9px) scale(1.08)}
.cookie:active{transform:scale(.92)}
.cookie.locked{opacity:.28;pointer-events:none;animation:none}
.cookie.crack{animation:crack .8s ease forwards}
@keyframes crack{0%{transform:scale(1) rotate(0)}30%{transform:scale(1.25) rotate(-8deg)}55%{transform:scale(1.15) rotate(9deg)}100%{transform:scale(0) rotate(30deg);opacity:0}}
.status{position:relative;z-index:2;font-size:12.5px;color:var(--mut);min-height:20px;text-align:center;padding:6px 20px}
/* 티켓 오버레이 */
.ovl{position:fixed;inset:0;background:rgba(15,11,7,.72);backdrop-filter:blur(4px);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:18px;overflow-y:auto}
.ovl[hidden]{display:none}
.ticket{background:var(--paper);color:var(--ink);border-radius:18px;max-width:400px;width:100%;
  padding:30px 26px 22px;position:relative;box-shadow:0 24px 70px rgba(0,0,0,.55);
  border:1px solid #E2D5B8;animation:rise .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes rise{from{transform:translateY(46px) scale(.94);opacity:0}to{transform:none;opacity:1}}
.seal{position:absolute;top:-20px;left:50%;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;
  background:linear-gradient(135deg,#8A6A2E,#B8791A);color:#FFF6E2;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:19px;box-shadow:0 5px 16px rgba(138,106,46,.5);border:2px solid #F1E0BC}
.t-eyebrow{text-align:center;font-size:11.5px;letter-spacing:.16em;color:#95610F;font-weight:700;margin:8px 0 14px}
.t-fortune{text-align:center;font-size:19px;font-weight:800;line-height:1.65;letter-spacing:-.01em;word-break:keep-all}
.t-tip{text-align:center;font-size:13px;color:#837968;margin-top:11px;line-height:1.6;word-break:keep-all}
.t-div{height:0;border-top:1.5px dashed #D8C9A6;margin:18px -8px;position:relative}
.t-div::before,.t-div::after{content:"";position:absolute;top:-9px;width:18px;height:18px;border-radius:50%;background:#221910}
.t-div::before{left:-27px}.t-div::after{right:-27px}
/* 오늘의 병 */
.bottle{display:flex;gap:12px;align-items:center;background:#FFFDF8;border:1px solid #E6DFD3;border-radius:13px;padding:11px 13px;
  text-decoration:none;color:inherit;transition:border-color .15s}
.bottle:hover{border-color:#D9BE8A}
.bottle img{width:46px;height:60px;object-fit:contain;flex:0 0 auto}
.bottle .fb{font-size:34px;width:46px;text-align:center}
.b-k{font-size:10.5px;font-weight:800;color:#95610F;letter-spacing:.1em}
.b-n{font-size:14px;font-weight:800;margin:2px 0;line-height:1.4;word-break:keep-all}
.b-m{font-size:12px;color:#837968}
.b-m b.hot{color:#B0431F}
.b-go{margin-left:auto;font-size:12px;color:#95610F;font-weight:700;white-space:nowrap}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.btn{border:none;border-radius:11px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn-main{background:linear-gradient(135deg,#8A6A2E,#B8791A);color:#FFF6E2}
.btn-ghost{background:#EFE8D8;color:#5A4A2E}
.btn-close{background:none;color:#9A8F7E;font-size:13px;padding:8px}
.reroll{font-size:12px;color:#95610F;background:none;border:none;cursor:pointer;font-weight:700;margin-top:10px;font-family:inherit;text-decoration:underline;text-underline-offset:3px}
.notice{font-size:10.5px;color:#A79B87;text-align:center;margin-top:13px;line-height:1.6}
footer{position:relative;z-index:2;margin-top:auto;padding:30px 20px 40px;text-align:center}
footer a{color:var(--mut);font-size:13px;text-decoration:none;font-weight:600}
footer a:hover{color:var(--gold)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#3A2C16;color:#F1E6CE;border:1px solid var(--line);
  padding:10px 18px;border-radius:24px;font-size:13px;z-index:300;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
@media(max-width:400px){.cookie{font-size:50px}h1{font-size:27px}}
</style>
</head>
<body>
<div class="dust" id="dust" aria-hidden="true"></div>

<header>
  <p class="eyebrow">합리적으로 사고, 즐겁게 마시다</p>
  <h1>🥠 주락 포춘</h1>
  <p class="sub">쟁반 위 쿠키 하나를 골라 오늘의 술 운세를 여세요.<br>하루 한 번 — 자정에 새 운세가 도착합니다.</p>
  <div class="divider" aria-hidden="true"><span class="l"></span><span class="d">✦ 酒 ✦</span><span class="l"></span></div>
</header>

<main style="position:relative;z-index:2">
  <section class="tray" id="tray" aria-label="포춘쿠키 선택"></section>
  <p class="status" id="status"></p>
</main>

<div class="ovl" id="ovl" hidden>
  <div class="ticket" role="dialog" aria-modal="true">
    <div class="seal">酒</div>
    <p class="t-eyebrow" id="tDate"></p>
    <h2 class="t-fortune" id="tText"></h2>
    <p class="t-tip" id="tTip"></p>
    <div class="t-div" aria-hidden="true"></div>
    <a class="bottle" id="tBottle" target="_blank" rel="noopener" hidden></a>
    <div class="btns">
      <button class="btn btn-main" id="btnImg">🖼 이미지로 저장</button>
      <button class="btn btn-ghost" id="btnShare">📤 공유하기</button>
      <button class="btn btn-close" id="btnClose">닫기</button>
    </div>
    <div style="text-align:center"><button class="reroll" id="btnReroll">😅 오늘 운세 이건 아니다… 딱 한 번만 다시</button></div>
    <p class="notice">재미로 보는 운세입니다 · 좋은 날일수록 한 잔만, 더 천천히 🥃<br>재고·가격은 참고용 — 현장과 다를 수 있어요</p>
  </div>
</div>

<footer><a href="/">← 주락(酒樂) 홈 — 트레이더스 재고·최저가 보러가기</a></footer>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ── 운세 풀 — 무드(m): peat 강렬 · sherry 달콤 · bourbon 여유 · wine 관계 · spark 축하 · sake 차분 · high 리프레시 ── */
const FORTUNES=[
 {m:"peat",t:"피트 향처럼 강렬한 하루.\n미뤄둔 그 일, 오늘 정면돌파가 답이다.",a:"복잡할수록 정공법 — 저녁의 한 모금이 보상이 된다."},
 {m:"peat",t:"오늘의 당신은 캐스크 스트렝스.\n물 타지 말고 원액 그대로 밀어붙여라.",a:"단, 마지막 결정 전 딱 한 번만 숨 고르기."},
 {m:"peat",t:"연기 너머가 보이는 날.\n남들이 놓친 디테일이 당신 눈에만 들어온다.",a:"회의에서 그 한마디, 아끼지 말 것."},
 {m:"peat",t:"거친 첫인상 뒤에 긴 여운 —\n오늘 만나는 어려운 상대가 귀인이 된다.",a:"첫 잔은 어색해도 두 번째 잔부터 편해진다."},
 {m:"peat",t:"아일라의 바람 같은 변화의 조짐.\n낯선 제안이 와도 겁내지 마라.",a:"안 하던 길로 퇴근해보면 답이 보인다."},
 {m:"peat",t:"오늘은 숙성이 아니라 증류의 날.\n불순물 같은 걱정은 끓여서 날려버려라.",a:"할 일 목록에서 세 줄만 남기고 지우기."},
 {m:"peat",t:"장작불처럼 은근히 오래가는 운.\n서두르지 않아도 저녁쯤 불씨가 커진다.",a:"조급함 대신 온도 유지 — 페이스가 무기다."},
 {m:"peat",t:"스모키한 카리스마가 통하는 날.\n밀당보다 직진이 매력으로 읽힌다.",a:"돌려 말하지 말고 결론부터."},
 {m:"sherry",t:"셰리 캐스크처럼 달콤한 기운.\n뜻밖의 사람에게서 좋은 소식이 온다.",a:"연락 망설이던 그 사람에게 먼저 안부를."},
 {m:"sherry",t:"건포도처럼 농축된 행운 —\n작지만 확실한 이득이 굴러온다.",a:"오늘 지나치는 '소소한 할인'을 놓치지 말 것."},
 {m:"sherry",t:"오래 묵힌 인연이 빛나는 날.\n옛 친구의 이름이 오늘 화면에 뜬다.",a:"먼저 온 연락엔 미루지 말고 바로 답장."},
 {m:"sherry",t:"더블 캐스크의 하루 — 일도 사랑도\n두 마리 토끼가 같은 방향으로 뛴다.",a:"욕심내도 되는 날. 단 순서는 지킬 것."},
 {m:"sherry",t:"당신의 진가가 뒤늦게 알려진다.\n숙성 연수는 거짓말을 하지 않는다.",a:"조용히 해온 그 일, 오늘은 살짝 티 내기."},
 {m:"sherry",t:"단맛 뒤에 스파이스 — 좋은 흐름 속\n작은 반전 하나는 애교로 받아들이자.",a:"짜증 포인트 하나쯤은 웃어넘기면 만사형통."},
 {m:"sherry",t:"올로로소처럼 깊고 부드러운 대화운.\n오늘의 저녁 자리가 관계를 숙성시킨다.",a:"듣기 7 : 말하기 3의 비율로."},
 {m:"sherry",t:"PX처럼 진한 애정운.\n무심한 척해도 달콤함이 새어나온다.",a:"표현은 오늘, 후회는 없게."},
 {m:"bourbon",t:"버번처럼 화통한 하루.\n스몰토크가 큰 기회로 이어진다.",a:"엘리베이터에서 만난 그 사람에게 먼저 인사."},
 {m:"bourbon",t:"새 오크통의 바닐라 향 — 시작운이 강하다.\n오늘 시작한 일은 유난히 잘 붙는다.",a:"미뤄온 '첫 삽'을 오늘 뜨자. 작게라도."},
 {m:"bourbon",t:"허세 없는 자신감이 매력인 날.\n있는 그대로의 당신이 제일 잘 팔린다.",a:"포장하지 말고 담백하게 승부."},
 {m:"bourbon",t:"켄터키 더위도 숙성을 돕는다 —\n오늘의 스트레스는 내공이 된다.",a:"고생은 엔젤스 셰어처럼 증발하고, 깊어진 당신만 남는다."},
 {m:"bourbon",t:"매시빌처럼 섞일수록 좋은 날.\n혼자 말고 팀으로 움직여라.",a:"점심은 혼밥 금지 — 누군가와 같이."},
 {m:"bourbon",t:"하이 라이 스파이스 — 톡 쏘는 아이디어가\n오후 3시쯤 번뜩인다.",a:"메모장을 가까이. 스치는 생각이 물건이 된다."},
 {m:"bourbon",t:"보틀드 인 본드 — 오늘의 약속은\n법적 효력급으로 지켜진다.",a:"믿고 기다려도 되는 날. 재촉은 금물."},
 {m:"bourbon",t:"싱글 배럴처럼 유일한 존재감.\n비교하지 마라, 당신 통은 당신 것.",a:"남의 SNS 열지 말고 내 일에 집중."},
 {m:"wine",t:"오늘의 당신은 그랑 크뤼 —\n어디에 서 있어도 급이 다르다.",a:"중요한 자리엔 좋아하는 옷을 입고 갈 것."},
 {m:"wine",t:"디캔팅이 필요한 하루.\n감정도 잠깐 공기를 쐬면 부드러워진다.",a:"욱하는 순간 10분만 산책."},
 {m:"wine",t:"좋은 빈티지의 만남운.\n오늘 스친 인연이 오래 간다.",a:"모임 제안이 오면 피곤해도 나가라."},
 {m:"wine",t:"타닌처럼 떫던 관계가 부드러워진다.\n시간이 당신 편이다.",a:"화해는 거창하게 말고 가볍게 한마디로."},
 {m:"wine",t:"테루아의 힘 — 지금 있는 자리에서\n당신다움이 무르익는 중이다.",a:"이직·이동 고민은 오늘 말고 다음 주에."},
 {m:"wine",t:"로제빛 애정운. 무드가 8할이다.",a:"저녁 조명을 낮추고 좋아하는 음악을 켤 것."},
 {m:"wine",t:"코르크가 '펑' — 막혀 있던 대화가\n오늘 뚫린다.",a:"먼저 여는 사람이 이긴다. 당신이 먼저."},
 {m:"wine",t:"바디감 있는 하루. 묵직한 일 하나를\n끝내면 나머지는 술술 풀린다.",a:"제일 무거운 일부터 오전에 해치우기."},
 {m:"spark",t:"기포처럼 솟아오르는 행운!\n작은 축하거리가 연달아 터진다.",a:"좋은 일은 그 자리에서 바로 자축할 것."},
 {m:"spark",t:"오늘은 샴페인을 아껴둘 이유가 없다.\n지금이 바로 그 '특별한 날'이다.",a:"미뤄둔 좋은 잔을 오늘 개시하자."},
 {m:"spark",t:"거품이 아니라 실속 — 반짝이는 제안의\n속을 들여다보면 진짜가 있다.",a:"솔깃한 이야기, 오늘은 믿어봐도 좋다."},
 {m:"spark",t:"토스트(건배)운 최고조.\n사람들 가운데에서 운이 커진다.",a:"오늘 건배 제의는 당신이 맡아라."},
 {m:"spark",t:"프리미에 크뤼급 컨디션 —\n몸도 마음도 탄산처럼 가볍다.",a:"미뤄둔 운동 딱 20분, 오늘은 된다."},
 {m:"spark",t:"셀러브레이션의 전조.\n이번 주 안에 축하할 일이 생긴다.",a:"냉장고에 스파클링 한 병, 미리 눕혀두기."},
 {m:"spark",t:"당신의 아이디어에 기포가 붙는 날 —\n말하는 순간 반응이 온다.",a:"아이디어는 익명 말고 실명으로 던져라."},
 {m:"spark",t:"황금빛 잔처럼 투명한 하루.\n숨기지 않을수록 일이 잘 풀린다.",a:"실수했다면 오늘 바로 오픈하는 게 이득."},
 {m:"sake",t:"준마이의 담백한 운 —\n화려하진 않지만 부족함도 없는 하루.",a:"오늘은 더하기 말고 빼기. 일정 하나를 비워라."},
 {m:"sake",t:"쌀을 깎듯 일을 깎아라.\n55%만 남기면 다이긴죠가 된다.",a:"보고서든 계획이든 절반으로 줄이면 명작."},
 {m:"sake",t:"차갑게 식힐수록 맑아지는 판단력.\n감정 말고 데이터로 결정하라.",a:"큰 결제·계약은 오후 늦게가 유리."},
 {m:"sake",t:"토쿠리에서 잔으로 — 오늘은 받는 날.\n호의를 사양하지 마라.",a:"'괜찮아요' 금지. '감사합니다'로 바꿔 말하기."},
 {m:"sake",t:"누룩처럼 보이지 않는 곳에서\n일이 익어가고 있다. 재촉 금지.",a:"확인 전화 대신 하루만 더 기다리기."},
 {m:"sake",t:"정갈한 안주 같은 사람이 곁에 온다.\n요란하지 않은 인연을 알아볼 것.",a:"조용한 사람의 말에 오늘의 힌트가 있다."},
 {m:"sake",t:"온도를 맞추는 하루 — 관계도 술도\n적정 온도일 때 가장 맛있다.",a:"열 올리지 말고 미지근하게, 꾸준하게."},
 {m:"sake",t:"신주(新酒)의 설렘 — 새로 배우는 것에\n오늘 유난히 습득이 빠르다.",a:"미뤄둔 강의 첫 강, 오늘 열어보기."},
 {m:"high",t:"하이볼처럼 청량한 리셋의 날.\n어제 일은 탄산과 함께 날려보내라.",a:"퇴근 후 첫 모금 전까지는 회사 앱 금지."},
 {m:"high",t:"얼음 세 개, 걱정 제로.\n단순하게 갈수록 운이 붙는다.",a:"고민은 세 줄로 요약하면 답이 보인다."},
 {m:"high",t:"레몬 한 조각의 디테일이\n오늘의 승부를 가른다.",a:"마무리 5%에 시간을 써라. 티가 난다."},
 {m:"high",t:"황금 비율의 하루 — 일 4 : 휴식 1.\n비율만 지키면 뭐든 맛있어진다.",a:"50분 일했으면 10분은 확실히 쉬기."},
 {m:"high",t:"탄산 빠지기 전에 마셔라 —\n오늘의 기회는 신선도가 생명.",a:"'나중에'라고 답하려던 것, 지금 답하기."},
 {m:"high",t:"섞을수록 맛있는 날.\n다른 팀, 다른 취향과 어울려보라.",a:"평소 안 가던 메뉴로 점심 도전."},
 {m:"high",t:"머들러로 저은 듯 술술 풀리는 오후.\n오전의 꼬임은 곧 정리된다.",a:"막힌 일은 점심 이후 다시 손대기."},
 {m:"high",t:"가볍게 던진 말이 홈런이 된다.\n부담 빼고 툭, 던져볼 것.",a:"완벽한 기획서보다 러프한 초안 먼저."},
];
const MOOD_CAT={peat:["위스키"],sherry:["위스키"],bourbon:["위스키"],wine:["와인"],spark:["스파클링"],sake:["사케","전통주"],high:["하이볼"]};
const MOOD_LABEL={peat:"강렬한 한 병",sherry:"달콤한 한 병",bourbon:"화통한 한 병",wine:"무드 있는 한 병",spark:"축하의 한 병",sake:"정갈한 한 병",high:"청량한 한 병"};

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const todayKey=()=>{const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();};
const dateLabel=()=>{const d=new Date();return `${d.getMonth()+1}월 ${d.getDate()}일 ${["일","월","화","수","목","금","토"][d.getDay()]}요일`;};
const LS="jurak_fortune";
const loadState=()=>{try{const s=JSON.parse(localStorage.getItem(LS));return s&&s.d===todayKey()?s:null;}catch(e){return null;}};
const saveState=s=>{try{localStorage.setItem(LS,JSON.stringify(s));}catch(e){}};

let DATA=null, CUR=null;
fetch("../data.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(d=>{DATA=d; if(CUR)fillBottle(CUR);}).catch(()=>{});

/* 골드 입자 */
(()=>{const box=document.getElementById("dust");for(let i=0;i<18;i++){const s=document.createElement("i");
 s.style.left=(Math.random()*100)+"vw";s.style.animationDelay=(Math.random()*9)+"s";s.style.animationDuration=(7+Math.random()*6)+"s";
 s.style.width=s.style.height=(2+Math.random()*2.5)+"px";box.appendChild(s);}})();

/* 쟁반 */
const tray=document.getElementById("tray"), status=document.getElementById("status");
function buildTray(locked){
  tray.innerHTML="";
  for(let i=0;i<5;i++){
    const b=document.createElement("button");
    b.className="cookie"+(locked?" locked":"");b.textContent="🥠";b.setAttribute("aria-label",`포춘쿠키 ${i+1}번`);
    b.onclick=()=>pick(i);
    tray.appendChild(b);
  }
  status.textContent=locked?"오늘의 운세는 이미 열었어요 — 아래에서 다시 볼 수 있어요":"마음이 가는 쿠키를 하나 고르세요";
  if(locked){
    const again=document.createElement("button");
    again.className="btn btn-main";again.style.cssText="margin:6px auto 0;display:block;padding:11px 22px";
    again.textContent="🎫 오늘의 운세 다시 보기";
    again.onclick=()=>{const s=loadState();if(s)openTicket(s,false);};
    status.after(again);
  }
}
function pick(i){
  const btns=[...tray.children];
  btns.forEach((b,j)=>{if(j!==i)b.classList.add("locked");});
  btns[i].classList.add("crack");
  const s={d:todayKey(),i,r:0};
  saveState(s);
  setTimeout(()=>openTicket(s,true),650);
}

/* 티켓 */
const ovl=document.getElementById("ovl");
function fortuneFor(s){
  const rnd=mulberry32(s.d*7+s.i*13+s.r*101);
  return FORTUNES[Math.floor(rnd()*FORTUNES.length)];
}
function openTicket(s,fresh){
  const f=fortuneFor(s); CUR={s,f};
  document.getElementById("tDate").textContent=`오늘의 술 운세 · ${dateLabel()}`;
  document.getElementById("tText").textContent=f.t;
  document.getElementById("tTip").textContent="✦ "+f.a;
  document.getElementById("btnReroll").style.display=s.r>=1?"none":"";
  fillBottle(CUR);
  ovl.hidden=false;
  if(fresh)buildTray(true);
}
function fillBottle(cur){
  const el=document.getElementById("tBottle");
  if(!DATA){el.hidden=true;return;}
  const prods=(DATA.products||DATA).filter(p=>p.in_stock&&MOOD_CAT[cur.f.m].some(c=>(p.category||"").includes(c)));
  if(!prods.length){el.hidden=true;return;}
  const rnd=mulberry32(cur.s.d*31+cur.s.i*17+cur.s.r*7);
  const p=prods[Math.floor(rnd()*prods.length)];
  CUR.p=p;
  const hot=p.price_diff_percent!=null&&p.price_diff_percent<=-20;
  el.href="/?sku="+encodeURIComponent(p.sku);
  el.innerHTML=`${p.image?`<img src="${esc(p.image)}" referrerpolicy="no-referrer" onerror="this.outerHTML='<span class=fb>🍾</span>'">`:`<span class="fb">🍾</span>`}
    <span><span class="b-k">운세가 고른 ${esc(MOOD_LABEL[cur.f.m])}</span>
    <span class="b-n" style="display:block">${esc(p.name)}</span>
    <span class="b-m">${p.price?p.price.toLocaleString()+"원":""}${hot?` · <b class="hot">🔥특가</b>`:""}${p.stores_in_stock_count?` · ${p.stores_in_stock_count}개 지점 재고`:""}</span></span>
    <span class="b-go">보러가기 →</span>`;
  el.hidden=false;
}
document.getElementById("btnClose").onclick=()=>{ovl.hidden=true;};
ovl.addEventListener("click",e=>{if(e.target===ovl)ovl.hidden=true;});
document.getElementById("btnReroll").onclick=()=>{
  const s=loadState();if(!s||s.r>=1)return;
  s.r=1;saveState(s);openTicket(s,false);
  toast("마지막 한 번이었어요 — 이게 진짜 운세입니다 🥠");
};

/* 공유 */
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2200);}
function drawCard(){
  const W=1080,H=1350,c=document.createElement("canvas");c.width=W;c.height=H;
  const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#1C140C");g.addColorStop(1,"#2A2013");
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.strokeStyle="#B8791A";x.lineWidth=3;x.strokeRect(46,46,W-92,H-92);
  x.strokeStyle="rgba(229,197,127,.35)";x.lineWidth=1;x.strokeRect(60,60,W-120,H-120);
  x.textAlign="center";x.fillStyle="#B4A17C";
  x.font="600 30px Pretendard, sans-serif";x.fillText("합리적으로 사고, 즐겁게 마시다",W/2,170);
  x.font="800 76px Pretendard, sans-serif";x.fillStyle="#F1E0BC";x.fillText("🥠 주락 포춘",W/2,272);
  x.font="600 32px Pretendard, sans-serif";x.fillStyle="#95610F";x.fillText(`오늘의 술 운세 · ${dateLabel()}`,W/2,352);
  // 운세 본문
  x.fillStyle="#F7F2E8";x.font="800 52px Pretendard, sans-serif";
  const lines=CUR.f.t.split("\n");let y=560;
  lines.forEach(l=>{x.fillText(l,W/2,y);y+=84;});
  x.fillStyle="#B4A17C";x.font="500 34px Pretendard, sans-serif";
  wrapText(x,"✦ "+CUR.f.a,W/2,y+40,860,52);
  // 오늘의 병
  if(CUR.p){
    x.strokeStyle="rgba(229,197,127,.3)";x.beginPath();x.moveTo(150,H-420);x.lineTo(W-150,H-420);x.stroke();
    x.fillStyle="#95610F";x.font="700 28px Pretendard, sans-serif";x.fillText("운세가 고른 오늘의 한 병",W/2,H-350);
    x.fillStyle="#F1E0BC";x.font="800 44px Pretendard, sans-serif";
    wrapText(x,CUR.p.name,W/2,H-290,880,58);
    x.fillStyle="#B4A17C";x.font="600 32px Pretendard, sans-serif";
    x.fillText((CUR.p.price?CUR.p.price.toLocaleString()+"원":""),W/2,H-180);
  }
  x.fillStyle="#8A6A2E";x.font="700 30px Pretendard, sans-serif";x.fillText("jurak.kr/fortune",W/2,H-100);
  return c;
}
function wrapText(x,text,cx,y,maxW,lh){
  const words=text.split(" ");let line="";
  words.forEach(w=>{const t=line?line+" "+w:w;
    if(x.measureText(t).width>maxW&&line){x.fillText(line,cx,y);y+=lh;line=w;}else line=t;});
  if(line)x.fillText(line,cx,y);
  return y;
}
document.getElementById("btnImg").onclick=()=>{
  try{
    const url=drawCard().toDataURL("image/png");
    const a=document.createElement("a");a.href=url;a.download=`주락포춘_${todayKey()}.png`;a.click();
    toast("이미지가 저장됐어요 🖼");
  }catch(e){toast("이미지 생성에 실패했어요 🙏");}
};
document.getElementById("btnShare").onclick=async()=>{
  const text=`🥠 오늘의 술 운세\n"${CUR.f.t.replace(/\n/g," ")}"\n${CUR.p?`오늘의 한 병: ${CUR.p.name}\n`:""}— 주락 포춘`;
  const url="https://jurak.kr/fortune/";
  try{
    if(navigator.share){await navigator.share({title:"주락 포춘 — 오늘의 술 운세",text,url});return;}
    await navigator.clipboard.writeText(text+"\n"+url);toast("운세가 복사됐어요 — 붙여넣어 공유하세요 📋");
  }catch(e){}
};

/* 초기화 */
const st=loadState();
buildTray(!!st);
</script>
</body>
</html>
