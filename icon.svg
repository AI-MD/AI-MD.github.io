<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E2415"/><stop offset="0.55" stop-color="#221910"/><stop offset="1" stop-color="#171009"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0D48A"/><stop offset="0.5" stop-color="#D9A94E"/><stop offset="1" stop-color="#B8791A"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8B75A"/><stop offset="1" stop-color="#9C6414"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#E5C57F" stop-opacity="0.16"/><stop offset="1" stop-color="#E5C57F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 배경: 에스프레소 라운드 스퀘어 + 은은한 상단 광 -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <!-- 이너 골드 라인 (프리미엄 프레임) -->
  <rect x="22" y="22" width="468" height="468" rx="98" fill="none" stroke="url(#gold)" stroke-width="4" opacity="0.55"/>
  <!-- 온더락 글라스 (크게, 중앙) -->
  <g transform="translate(256 252)">
    <!-- 잔 바디 (살짝 벌어진 텀블러) -->
    <path d="M -122 -108 L -108 132 Q -106 150 -86 150 L 86 150 Q 106 150 108 132 L 122 -108 Z"
          fill="none" stroke="url(#gold)" stroke-width="19" stroke-linejoin="round"/>
    <!-- 위스키 -->
    <path d="M -111 24 L -105 117 Q -104 132 -86 132 L 86 132 Q 104 132 105 117 L 111 24 Z"
          fill="url(#liquid)"/>
    <!-- 얼음 (기울어진 사각, 액면에 반쯤 잠김) -->
    <g transform="translate(8 40) rotate(-14)">
      <rect x="-38" y="-38" width="76" height="76" rx="14" fill="#F7EFDF" opacity="0.93"/>
      <path d="M -20 -38 L 8 38" stroke="#D8CBAF" stroke-width="5.5" opacity="0.55"/>
    </g>
    <!-- 액체 표면 라인 -->
    <line x1="-109" y1="24" x2="109" y2="24" stroke="#F0D48A" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
